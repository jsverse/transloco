name: Bug Report
description: Report a bug in one of the Transloco packages
title: 'Bug: '
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        > **Note:** Our policy is that issues reported without a reproduction will be closed immediately and then reopened once a reproduction has been provided. Please respect the developers of this project by doing this. We give of our personal time to work on this project and would rather be spending our time fixing or enhancing the library than chasing down badly described or unreproducable issues. Please delete this note once you have read it.

  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true

  - type: dropdown
    id: affected-packages
    attributes:
      label: Which Transloco package(s) are the source of the bug?
      options:
        - Transloco
        - Schematics
        - Locale
        - MessageFormat
        - Optimize
        - Persist Lang
        - Persist Translations
        - Preload Langs
        - Scoped Libs
        - Keys Manager
        - Validator
        - Don't know / other
      multiple: true
    validations:
      required: true

  - type: dropdown
    id: is-regression
    attributes:
      label: Is this a regression?
      description: A regression is behaviour that used to work and stopped working in a newer version.
      options:
        - 'Yes'
        - 'No'
        - "Don't know"
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Link to a minimal reproduction
      description: 'Issues without a reproduction cannot be investigated and will be closed. Fork this CodeSandbox playground to get started: https://codesandbox.io/p/sandbox/jsverse-transloco-kn52hs'
    validations:
      required: true

  - type: textarea
    id: transloco-config
    attributes:
      label: Transloco Config
      render: markdown
      placeholder: Provide the Transloco configuration if relevant to the issue

  - type: textarea
    id: debug-logs
    attributes:
      label: Debug Logs
      render: markdown
      placeholder: If this bug is related to the Keys Manager, run it in debug mode and add any relevant information

  - type: textarea
    id: environment
    attributes:
      label: Please provide the environment you discovered this bug in
      render: markdown
      value: |
        Transloco: 
        Transloco Keys Manager: 
        Angular: 
        Node: 
        Package Manager: 
        OS:

  - type: textarea
    id: browser
    attributes:
      label: Browser
      render: markdown
      placeholder: |
        Chrome (desktop/Android/iOS) version XX
        Firefox version XX
        Safari (desktop/iOS) version XX
        Edge version XX

  - type: textarea
    id: other
    attributes:
      label: Additional context
      description: Links? References? Anything that will give us more context about the issue you are encountering!

  - type: dropdown
    id: contribution
    attributes:
      label: I would like to make a pull request for this bug
      options:
        - 'Yes 🚀'
        - 'No'
    validations:
      required: true
