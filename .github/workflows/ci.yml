name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci-step:
    strategy:
      fail-fast: false
      matrix:
        target: ['build', 'test', 'lint', 'format']
    runs-on: ubuntu-latest
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/step-setup

      - name: Run ci:${{ matrix.target }}
        run: npm run ci:${{ matrix.target }}
        shell: bash

      # LICENSE is extensionless, so it slips past a `*.md` assets glob with no
      # error — which is how six packages shipped unlicensed up to 8.4.0 (#986).
      # Gate it here, where a broken `assets` edit fails on the PR that made it,
      # rather than only in release.yml where the first symptom would be an
      # already-published tarball.
      - name: Verify LICENSE in every released package
        if: ${{ matrix.target == 'build' }}
        run: npm run verify:license
        shell: bash

      - name: Publish any commit / build for testing
        if: ${{ matrix.target == 'build' && github.ref != 'refs/heads/master' }}
        run: npm run release:pkg-pr-new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # e2e runs in Playwright's own image, which already ships Chromium and every
  # OS library it needs — no `playwright install` step, no browser cache to
  # maintain. It cannot join the `ci-step` matrix above because a container is
  # per-job, not per-matrix-entry.
  #
  # The single-entry matrix below is not a matrix in spirit: `container.image`
  # can interpolate `matrix` but not `env`, so this is the only way to write the
  # Playwright version once and reuse it in both the image tag and the drift
  # check. Bump it together with @playwright/test in package.json.
  e2e:
    permissions:
      contents: read
    strategy:
      matrix:
        playwright: ['1.62.1']
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
    name: e2e
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs Node 24 over the image's bundled Node, so e2e runs on the same
      # runtime as every other job.
      - name: Setup
        uses: ./.github/actions/step-setup

      - name: Verify Playwright image
        uses: ./.github/actions/verify-playwright-image
        with:
          expected-version: ${{ matrix.playwright }}

      - name: Run ci:e2e
        run: npm run ci:e2e
        shell: bash

  # keys-manager's peer ranges are far wider than the versions the workspace
  # pins, and Angular 21.1 reshaped template AST nodes its extractors read.
  keys-manager-compat:
    # Checks out and runs pull-request code; the steps below only ever read the
    # repository, so the token is narrowed to match.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported: flat @switch cases, and compiler-cli@20.0.x caps ts below 5.9.
          - angular: '20'
            typescript: '5.8'
          # Last minor before the AST reshape.
          - angular: '21.0'
            typescript: '5.9'
          - angular: '21'
            typescript: '5.9'
          # Newest supported; Angular 22 requires ts 6.0.
          - angular: '22'
            typescript: '6.0'
    runs-on: ubuntu-latest
    name: keys-manager ng${{ matrix.angular }} ts${{ matrix.typescript }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/step-setup

      - name: Build keys-manager
        run: npx nx build transloco-keys-manager
        shell: bash

      - name: Verify key extraction
        run: |
          node tools/scripts/verify-keys-manager-compat.mts \
            --angular=${{ matrix.angular }} \
            --typescript=${{ matrix.typescript }}
        shell: bash

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/step-setup

      - name: Validate PR commits with commitlint
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@v5
        with:
          path: ~/bin/actionlint
          key: ${{ runner.os }}-actionlint-v1.7.12
          restore-keys: |
            ${{ runner.os }}-actionlint-

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        # Pinned SHA256 (from actionlint_1.7.12_checksums.txt) verifies the
        # download before extraction — `set -e` ensures a checksum mismatch
        # aborts the step rather than falling through to tar/chmod. Update the
        # checksum alongside the version in the cache key above.
        run: |
          set -euo pipefail
          mkdir -p ~/bin
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar xz -C ~/bin actionlint < /tmp/actionlint.tar.gz
          chmod +x ~/bin/actionlint

      - name: Add actionlint to PATH
        run: echo "${HOME}/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

  # Single required status check. Branch protection should require only this
  # job; the matrix targets and jobs above can change freely without editing
  # branch-protection rules.
  ci-passed:
    if: always()
    needs:
      - ci-step
      - e2e
      - keys-manager-compat
      - commitlint
      - actionlint
    runs-on: ubuntu-latest
    name: CI Passed
    steps:
      - name: Verify all CI jobs passed
        # Derive pass/fail from the whole `needs` object rather than a
        # hand-maintained list of `<job>.result` lines. `skipped` and
        # `success` both pass; only `failure` / `cancelled` fail the gate.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failed"
            exit 1
          fi
          echo "All required jobs passed (or were skipped)."
