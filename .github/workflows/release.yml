name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = infer from conventional commits). Every pre* option requires a preid.'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease
      preid:
        description: 'Prerelease identifier (alpha, beta, rc). Required for every pre* bump, and on EVERY subsequent prerelease run — see the Version step.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Dry run (builds + packs + publish --dry-run; no real publish, commit, tag, or push)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

# Per-ref group: real releases (master-only) still serialize, while a
# dry-run dispatched from a branch never queue-blocks a real release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Real releases are master-only; dry-runs touch nothing remote (publish runs
  # with --dry-run; push/changelog are gated on !inputs.dry-run), so they may
  # be dispatched from any branch to exercise the *release* pipeline — they do
  # not verify the code, since the gate below is skipped on a dry run.
  #
  # Skipped on dry-run: ci.yml already runs lint/test/build/e2e on every PR and
  # on every push to master, and a dry run only asks "does the release pipeline
  # work" — nothing it does depends on the code being green. Re-proving it would
  # be pure latency in front of the steps actually under test.
  gate:
    if: ${{ !inputs.dry-run && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        target: ['ci:lint', 'ci:test']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/step-setup

      - name: Run ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: npm run "$TARGET"

  # Same gate, separate job: e2e runs inside Playwright's own image (Chromium
  # and its OS deps are baked in), and a container is per-job. Keep the
  # `playwright` matrix value in lockstep with ci.yml and @playwright/test —
  # see the longer note in ci.yml.
  gate-e2e:
    # Same dry-run skip as `gate` above — see the note there.
    if: ${{ !inputs.dry-run && github.ref == 'refs/heads/master' }}
    # The workflow-level scope (contents: write + id-token: write) exists for
    # the `release` job's push and OIDC publish. A gate only ever reads.
    permissions:
      contents: read
    name: ci:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        playwright: ['1.62.1']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/step-setup

      - name: Verify Playwright image
        uses: ./.github/actions/verify-playwright-image
        with:
          expected-version: ${{ matrix.playwright }}

      - name: Run ci:e2e
        run: npm run ci:e2e

  # `skipped` is an accepted gate result: on a dry run both gates are skipped,
  # and a bare `needs:` would cascade that skip to this job. `!cancelled()`
  # still keeps a cancelled run from ever reaching the publish step.
  release:
    needs: [gate, gate-e2e]
    if: >-
      ${{ !cancelled()
      && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
      && (needs.gate-e2e.result == 'success' || needs.gate-e2e.result == 'skipped')
      && (github.ref == 'refs/heads/master' || inputs.dry-run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Mint a short-lived GitHub App installation token. The app is a bypass
      # actor on the master branch ruleset, so the release commit/tag push below
      # is authorized while humans still go through PRs + status checks. The
      # token is auto-revoked when the job ends (effective lifetime ≈ job run)
      # and is scoped to repo Contents only.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # `client-id` supersedes the deprecated `app-id` input; the action
          # forwards either verbatim as the JWT issuer and GitHub accepts the
          # numeric App ID there, so the existing secret keeps working as-is.
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least-privilege: the token only needs Contents (push release
          # commit/tag to master + create the GitHub Release). Declaring it
          # here enforces the scope at the workflow level instead of relying
          # solely on the app installation's configured permissions.
          permission-contents: write

      # Persist the app token so the later `git push HEAD:master` authenticates
      # as the bypass-capable app — the default GITHUB_TOKEN cannot push to the
      # protected branch (rejected with GH006)
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      # Shared setup: Node 24 + npm ci. It deliberately sets no registry-url,
      # which OIDC trusted publishing (below) depends on — see step-setup.
      - name: Setup
        uses: ./.github/actions/step-setup

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # MUST run BEFORE Version, which creates the releases/{version} tag.
      #
      # `nx release changelog` is a separate process here, so it cannot know the
      # range this run covers: with no --from it resolves the start ref from the
      # newest tag matching releaseTag.pattern, and by then that is the tag this
      # very run just created. The range collapses to empty and every release
      # note reads "This was a version bump only, there were no code changes" —
      # which is what happened to 9.0.0-alpha.0. (It never bit the single-command
      # `nx release`, where the changelog is computed in-process before tagging.)
      #
      # Two outputs because the correct start ref depends on the version that
      # Version resolves, which is not known yet:
      #   prerelease -> previous tag of any kind (incremental notes per alpha)
      #   stable     -> previous STABLE tag, so 9.0.0 carries the whole
      #                 8.4.0 -> 9.0.0 story rather than only the post-beta tail
      #
      # The stable rule matches nx's strictPreid resolution; the prerelease rule
      # deliberately does not. nx filters prerelease tags by preid, so the first
      # 9.0.0-beta.0 would find no `-beta.` tag, fall back to the last stable and
      # re-list everything the alphas already published. Keying off "previous
      # release of any kind" keeps every prerelease entry incremental across a
      # preid change; CHANGELOG.md accumulates the entries either way.
      #
      # versionsort.suffix=- makes git rank 9.0.0-alpha.1 below 9.0.0, matching
      # semver; --sort=-v:refname matches how nx enumerates tags internally.
      - name: Resolve previous release tags
        id: prev-tags
        run: |
          # Read the tags with a loop rather than a `... | head -1` pipeline:
          # head exits early and SIGPIPEs git, which the runner's default
          # `-o pipefail` would turn into a spurious step failure.
          ANY=""
          STABLE=""
          while IFS= read -r tag; do
            if [[ -z "$ANY" ]]; then ANY="$tag"; fi
            # The "releases/" prefix has no hyphen, so a hyphen anywhere in the
            # tag is a semver prerelease identifier
            if [[ -z "$STABLE" && "$tag" != *-* ]]; then STABLE="$tag"; fi
          done < <(git -c versionsort.suffix=- tag --list 'releases/*' --sort=-v:refname)
          echo "Previous release tags: any=${ANY:-<none>} stable=${STABLE:-<none>}"
          {
            echo "any=$ANY"
            echo "stable=$STABLE"
          } >> "$GITHUB_OUTPUT"

      # Always bump the manifests for real so the version is on disk for the
      # build + publish steps. On a dry run we pass --git-commit=false
      # --git-tag=false: the files are written (never pushed) so the publish
      # dry-run can pack a non-colliding version, but no commit or tag is made.
      # package.json is therefore the authoritative version source in both
      # modes (a stable JSON contract; drives the changelog + GitHub release).
      - name: Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
          DRY_RUN: ${{ inputs.dry-run }}
          # Single source of truth for tag ordering — see "Resolve previous
          # release tags" above
          LATEST_RELEASE_TAG: ${{ steps.prev-tags.outputs.any }}
        run: |
          set -o pipefail
          GIT_FLAGS=()
          if [[ "$DRY_RUN" == "true" ]]; then GIT_FLAGS=(--git-commit=false --git-tag=false); fi
          # nx's releaseTag.strictPreid defaults to true, so WITHOUT --preid the
          # current-version lookup skips prerelease tags and falls back to the
          # latest STABLE tag. A bare `prerelease` therefore does not advance an
          # existing prerelease — it recomputes off the stable version and emits
          # the same colliding version on every run (8.4.0 -> 8.4.1-0, twice).
          # Hence: preid is mandatory for pre* bumps, on the first cut and on
          # every follow-up alpha alike.
          PREID_FLAG=()
          if [[ -n "$PREID" ]]; then
            PREID_FLAG=(--preid "$PREID")
          elif [[ "$BUMP" == pre* ]]; then
            echo "::error::bump=$BUMP requires a preid (e.g. alpha). Without it nx resolves the current version from the latest stable tag and produces a colliding version."
            exit 1
          fi
          # Same strictPreid trap, but for `auto`: while a prerelease line is
          # active, a preid-less run resolves off the last STABLE tag, so
          # conventional commits would cut a stable release mid-alpha (8.4.0 ->
          # 9.0.0) and publish it to `latest`, skipping everything the alphas
          # already shipped. An explicit specifier is a deliberate choice
          # (`major` is how you graduate), so only `auto` is blocked here.
          if [[ "$BUMP" == "auto" && -z "$PREID" && "$LATEST_RELEASE_TAG" == *-* ]]; then
            echo "::error::A prerelease line is active ($LATEST_RELEASE_TAG). bump=auto without a preid resolves off the last stable tag and would cut a stable release. Pass preid to continue the prerelease line, or an explicit bump (major/minor/patch) to leave it deliberately."
            exit 1
          fi
          if [[ "$BUMP" == "auto" ]]; then
            npx nx release version --verbose "${PREID_FLAG[@]}" "${GIT_FLAGS[@]}"
          else
            npx nx release version "$BUMP" --verbose "${PREID_FLAG[@]}" "${GIT_FLAGS[@]}"
          fi
          VERSION=$(node -p "require('./libs/transloco/package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Build AFTER version so dist/ package.json files carry the bumped version
      - name: Build
        run: npm run ci:build

      # Belt-and-braces re-check of the CI gate: npm publish is irreversible, so
      # an unlicensed tarball cannot be taken back. Runs before any git push or
      # publish so a failure here aborts the release with nothing released.
      - name: Verify LICENSE in every released package
        run: npm run verify:license

      # The releases/{version} tag must be on the remote BEFORE the changelog
      # step creates the GitHub release, otherwise the API invents the tag at
      # the old master HEAD.
      #
      # --atomic because refs otherwise push independently: a rejected branch
      # update still leaves the tag behind. That is exactly what the
      # 9.0.0-alpha.0 run did — master was rejected (GH006) while
      # releases/9.0.0-alpha.0 landed. master's version therefore never moved,
      # so the retry recomputed the same version against a tag that already
      # existed at a different commit, and would have been rejected again as a
      # non-fast-forward tag update. All-or-nothing keeps a failed release
      # re-runnable without manual tag cleanup.
      - name: Push commit and tag
        if: ${{ !inputs.dry-run }}
        run: git push --atomic --follow-tags origin HEAD:master

      # Use the app token (not the default GITHUB_TOKEN): nx release changelog
      # both creates the GitHub Release and may push the changelog commit, so it
      # needs the bypass-capable identity for the push to protected master.
      #
      # --from is mandatory here, not an optimisation: without it nx resolves
      # the start ref to the tag the Version step just created and emits an
      # empty changelog. See "Resolve previous release tags" above for why there
      # are two candidates and how the choice between them is made.
      # With no previous tag at all (first ever release) --from is omitted so
      # nx.json's automaticFromRef falls back to the first commit.
      - name: Changelog and GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.value }}
          PREV_ANY: ${{ steps.prev-tags.outputs.any }}
          PREV_STABLE: ${{ steps.prev-tags.outputs.stable }}
        run: |
          PREV="$PREV_STABLE"
          if [[ "$VERSION" == *-* ]]; then PREV="$PREV_ANY"; fi
          FROM=()
          if [[ -n "$PREV" ]]; then FROM=(--from "$PREV"); fi
          echo "Generating changelog for $VERSION from ${PREV:-<first commit>}"
          npx nx release changelog "$VERSION" "${FROM[@]}" --verbose

      # The changelog step commits CHANGELOG.md locally — push it too
      - name: Push changelog commit
        if: ${{ !inputs.dry-run }}
        run: git push origin HEAD:master

      # Publish LAST: npm publish is irreversible, so it runs only after every
      # fallible git step (push to protected master, changelog, tag push) has
      # succeeded — preventing the npm-ahead-of-git split-brain that left 8.4.0
      # published while master stayed un-updated. Re-running is safe: nx skips
      # versions already on the registry. Always runs; on a dry run, --dry-run
      # packs the tarballs and exercises the publish path (version, packageRoot,
      # tag, access) without uploading — note this does NOT exercise OIDC auth,
      # which only a real publish does. Prereleases go to the `next` dist-tag so
      # `npm i @jsverse/transloco` (latest) never resolves to a prerelease. That
      # is decided by the version actually computed above, NOT by the bump input:
      # `premajor` is a prerelease too, and once a prerelease is current, `auto`
      # resolves internally to `prerelease` while the input string stays "auto" —
      # keying off the input would publish those alphas over the stable `latest`.
      # Provenance attestations are generated automatically with trusted
      # publishing — no --provenance flag needed.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          TAG="latest"
          if [[ "$VERSION" == *-* ]]; then TAG="next"; fi
          DRY=()
          if [[ "$DRY_RUN" == "true" ]]; then DRY=(--dry-run); fi
          npx nx release publish --access public --tag "$TAG" --verbose "${DRY[@]}"

      # Cosmetic and deliberately last: the tag is pushed and the tarballs are
      # on npm by now, so a Discord outage must not fail the job and tempt a
      # re-run. The script self-skips while the secret is unset.
      #
      # Setup: create a webhook on the #releases channel (Edit Channel ->
      # Integrations -> Webhooks) and store its URL as DISCORD_RELEASES_WEBHOOK.
      - name: Announce release on Discord
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: node .github/workflows/scripts/announce-release.mts

      - name: Summary
        if: always()
        env:
          OUT_VERSION: ${{ steps.version.outputs.value }}
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          # Mirrors the Publish step's rule; "n/a" when the version step never ran
          DIST_TAG="n/a"
          if [[ -n "$OUT_VERSION" ]]; then
            DIST_TAG="latest"
            if [[ "$OUT_VERSION" == *-* ]]; then DIST_TAG="next"; fi
          fi
          {
            echo "## Release run"
            echo ""
            echo "- Version: \`${OUT_VERSION:-n/a}\`"
            echo "- Bump input: \`${BUMP}\`"
            echo "- Preid: \`${PREID:-none}\`"
            echo "- npm dist-tag: \`${DIST_TAG}\`"
            echo "- Dry run: \`${DRY_RUN}\`"
            echo "- Ref: \`${REF}\`"
            echo "- Triggered by: @${ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
