name: 'Setup Node and install dependencies'
description: 'Setup Node and install dependencies'

runs:
  using: composite
  steps:
    # One step for pnpm, Node and the install. pnpm's version comes from
    # package.json's `packageManager`, Node's from .nvmrc. No store cache: a cold
    # install takes ~13s, so there is little for one to save.
    #
    # It writes no registry-url/_authToken into .npmrc, which OIDC trusted
    # publishing in release.yml depends on — keep it that way.
    - uses: pnpm/setup@v3
      with:
        # Installs with --frozen-lockfile, and fails outright if the lockfile
        # is missing instead of resolving a fresh one.
        require-lockfile: true
