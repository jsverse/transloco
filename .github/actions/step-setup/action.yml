name: 'Setup Node and install dependencies'
description: 'Setup Node and install dependencies'

runs:
  using: composite
  steps:
    # Takes its version from package.json's `packageManager`. Must precede
    # setup-node, whose `cache: pnpm` needs the pnpm binary to locate the store.
    # v6.0.6 is the floor: older releases break OIDC trusted publishing.
    - uses: pnpm/action-setup@v6

    # Do NOT add registry-url here: it writes an _authToken=${NODE_AUTH_TOKEN}
    # line into .npmrc that shadows OIDC trusted publishing in release.yml.
    # pnpm 10 hands the packed tarball to `npm publish`, so the npm bundled with
    # Node 24 (>= 11.5.1, which OIDC trusted publishing requires) still does the
    # upload. pnpm 11+ publishes natively and needs Nx 23 — see pnpm-workspace.yaml.
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
