# Single-version Nx workspace: every dependency lives in the root package.json,
# so no `packages` are listed. Listing libs/* would make pnpm install each lib's
# own ranges (e.g. transloco-utils' cosmiconfig 9 next to the root's 10).
#
# pnpm is on 11, not 12 (package.json `devEngines.packageManager`): pnpm 12's
# rewritten `publish` has OIDC and provenance support that pnpm itself has not
# tested end to end yet (pnpm/pnpm#12738, #12739), and release.yml relies on
# both.
# Whatever the pnpm major, Nx must be >= 23 — Nx 22's `nx release publish`
# passes `--@scope:registry`, which pnpm 11+ rejects (nrwl/nx#36860).

allowBuilds:
  # Native binaries and Nx's post-install; each ran unconditionally under npm.
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
